version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: devworkbench
    environment:
      POSTGRES_USER: devworkbench
      POSTGRES_PASSWORD: devworkbench
      POSTGRES:DB: devworkbench
    ports:
      - "5432:5432" 
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db-data: