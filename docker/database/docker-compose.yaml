services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: devworkbench
    environment:
      POSTGRES_USER: devworkbench
      POSTGRES_PASSWORD: devworkbench
      POSTGRES_DB: devworkbench
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  db-data:   